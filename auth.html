<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotionX - Login / Register</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header>
        <h1>MotionX</h1>
        <nav>
            <a href="index.html">Scoreboard</a>
            <a href="auth.html" id="nav-auth">Login/Register</a>
            <a href="character.html" id="nav-char" style="display:none;">My Character</a>
        </nav>
    </header>

    <main>
        <div class="panel">
            <div class="tabs">
                <div class="tab active" id="tab-login" onclick="switchTab('login')">Login</div>
                <div class="tab" id="tab-register" onclick="switchTab('register')">Create Account</div>
            </div>

            <h2 id="auth-title">Login</h2>
            <form id="auth-form">
                <div class="form-group">
                    <label for="username">Username (3-10 chars)</label>
                    <input type="text" id="username" maxlength="10" required pattern="[A-Za-z0-9_]{3,10}" title="3-10 characters, letters, numbers, and underscores only.">
                </div>
                <div class="form-group">
                    <label for="password">Password (6-10 chars)</label>
                    <input type="password" id="password" maxlength="10" required minlength="6">
                </div>
                <button type="submit" id="submit-btn">Login</button>
                <div id="auth-message"></div>
            </form>
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        let mode = 'login';
        
        function switchTab(newMode) {
            mode = newMode;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-register').classList.toggle('active', mode === 'register');
            document.getElementById('auth-title').innerText = mode === 'login' ? 'Login' : 'Create Account';
            document.getElementById('submit-btn').innerText = mode === 'login' ? 'Login' : 'Create Account';
            document.getElementById('auth-message').innerHTML = '';
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const msg = document.getElementById('auth-message');

            msg.innerHTML = '<span style="color:var(--accent-color)">Processing...</span>';

            try {
                if (mode === 'register') {
                    const { data, error } = await window.supabaseClient.rpc('register_user', {
                        p_username: username,
                        p_password: password
                    });

                    if (error) {
                        msg.innerHTML = `<span class="error">Database Error: ${error.message}</span>`;
                    } else if (data === false) {
                        msg.innerHTML = '<span class="error">Username already taken!</span>';
                    } else {
                        localStorage.setItem('motionx_user', username);
                        msg.innerHTML = '<span class="success">Account created! Redirecting...</span>';
                        setTimeout(() => window.location.href = 'character.html', 1000);
                    }
                } else {
                    const { data, error } = await window.supabaseClient.rpc('login_user', {
                        p_username: username,
                        p_password: password
                    });

                    if (error) {
                        msg.innerHTML = `<span class="error">Database Error: ${error.message}</span>`;
                    } else if (data === true) {
                        localStorage.setItem('motionx_user', username);
                        msg.innerHTML = '<span class="success">Logged in! Redirecting...</span>';
                        setTimeout(() => window.location.href = 'character.html', 1000);
                    } else {
                        msg.innerHTML = '<span class="error">Invalid username or password!</span>';
                    }
                }
            } catch (err) {
                msg.innerHTML = `<span class="error">Exception: ${err.message}</span>`;
            }
        });
    </script>
</body>
</html>
