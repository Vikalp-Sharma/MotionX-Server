<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotionX - Login / Register</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="bg-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <header>
        <div class="logo">
            <h1>Motion<span class="logo-accent">X</span></h1>
        </div>
        <nav>
            <a href="index.html">🏆 Scoreboard</a>
            <a href="auth.html" class="nav-active" id="nav-auth">⚔️ Login</a>
            <a href="character.html" id="nav-char" style="display:none;">🧙 Character</a>
        </nav>
    </header>

    <main>
        <div class="panel fade-in-up" style="max-width: 460px;">
            <div class="tabs">
                <div class="tab active" id="tab-login" onclick="switchTab('login')">⚔️ Login</div>
                <div class="tab" id="tab-register" onclick="switchTab('register')">🛡️ Register</div>
            </div>

            <div class="panel-header">
                <h2 id="auth-title">Welcome Back, Warrior</h2>
                <p class="panel-subtitle" id="auth-subtitle">Enter your credentials to continue your journey</p>
            </div>

            <form id="auth-form">
                <div class="form-group">
                    <label for="username">👤 Username <span class="hint">(3-10 chars)</span></label>
                    <input type="text" id="username" maxlength="10" required pattern="[A-Za-z0-9_]{3,10}" title="3-10 characters, letters, numbers, and underscores only." placeholder="Enter username...">
                </div>
                <div class="form-group">
                    <label for="password">🔒 Password <span class="hint">(6-10 chars)</span></label>
                    <input type="password" id="password" maxlength="10" required minlength="6" placeholder="Enter password...">
                </div>
                <button type="submit" id="submit-btn" class="btn-primary">⚔️ Login</button>
                <div id="auth-message"></div>
            </form>
        </div>
    </main>

    <footer>
        <p>MotionX &copy; 2026 — Move your body, level up your character.</p>
    </footer>

    <script src="app.js"></script>
    <script>
        let mode = 'login';
        
        function switchTab(newMode) {
            mode = newMode;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-register').classList.toggle('active', mode === 'register');
            document.getElementById('auth-title').innerText = mode === 'login' ? 'Welcome Back, Warrior' : 'Create Your Legend';
            document.getElementById('auth-subtitle').innerText = mode === 'login' 
                ? 'Enter your credentials to continue your journey'
                : 'Choose a name and forge your destiny';
            document.getElementById('submit-btn').innerHTML = mode === 'login' ? '⚔️ Login' : '🛡️ Create Account';
            document.getElementById('auth-message').innerHTML = '';
        }

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const msg = document.getElementById('auth-message');

            msg.innerHTML = '<span class="loading-text"><div class="spinner"></div> Processing...</span>';

            try {
                if (mode === 'register') {
                    const { data, error } = await window.supabaseClient.rpc('register_user', {
                        p_username: username,
                        p_password: password
                    });

                    if (error) {
                        msg.innerHTML = `<span class="error">❌ ${error.message}</span>`;
                    } else if (data === false) {
                        msg.innerHTML = '<span class="error">❌ Username already taken!</span>';
                    } else {
                        localStorage.setItem('motionx_user', username);
                        msg.innerHTML = '<span class="success">✅ Account created! Redirecting...</span>';
                        setTimeout(() => window.location.href = 'character.html', 1000);
                    }
                } else {
                    const { data, error } = await window.supabaseClient.rpc('login_user', {
                        p_username: username,
                        p_password: password
                    });

                    if (error) {
                        msg.innerHTML = `<span class="error">❌ ${error.message}</span>`;
                    } else if (data === true) {
                        localStorage.setItem('motionx_user', username);
                        msg.innerHTML = '<span class="success">✅ Logged in! Redirecting...</span>';
                        setTimeout(() => window.location.href = 'character.html', 1000);
                    } else {
                        msg.innerHTML = '<span class="error">❌ Invalid username or password!</span>';
                    }
                }
            } catch (err) {
                msg.innerHTML = `<span class="error">❌ Exception: ${err.message}</span>`;
            }
        });
    </script>
</body>
</html>
