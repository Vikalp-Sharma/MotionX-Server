<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotionX - Global Scoreboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="bg-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <header>
        <div class="logo">
            <h1>Motion<span class="logo-accent">X</span></h1>
        </div>
        <nav>
            <a href="index.html" class="nav-active">🏆 Scoreboard</a>
            <a href="auth.html" id="nav-auth">⚔️ Login</a>
            <a href="character.html" id="nav-char" style="display:none;">🧙 Character</a>
        </nav>
    </header>

    <main>
        <div class="panel fade-in-up">
            <div class="panel-header">
                <h2>🏆 Global Scoreboard</h2>
                <p class="panel-subtitle">Top warriors ranked by coins earned</p>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Player</th>
                            <th>🪙 Coins</th>
                            <th>🔥 Streak</th>
                            <th>⏱️ Time</th>
                            <th>🎮 Games</th>
                        </tr>
                    </thead>
                    <tbody id="scoreboard-body">
                        <tr><td colspan="6" style="text-align:center;"><div class="spinner"></div> Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer>
        <p>MotionX &copy; 2026 — Move your body, level up your character.</p>
    </footer>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const { data, error } = await window.supabaseClient
                    .from('profiles')
                    .select('username, coins, max_streak, total_duration, games_played')
                    .order('coins', { ascending: false })
                    .limit(100);

                const tbody = document.getElementById('scoreboard-body');
                
                if (error) {
                    tbody.innerHTML = `<tr><td colspan="6" class="error">Error: ${error.message}</td></tr>`;
                    return;
                }

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; opacity:0.6;">No warriors yet. Be the first to play!</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.map((player, index) => {
                    const rankClass = index < 3 ? `rank-${index + 1}` : '';
                    const rankIcon = index === 0 ? '👑' : index === 1 ? '🥈' : index === 2 ? '🥉' : `#${index + 1}`;
                    return `
                        <tr class="${rankClass}">
                            <td><span class="rank-badge">${rankIcon}</span></td>
                            <td class="player-name">${player.username}</td>
                            <td>${player.coins.toLocaleString()}</td>
                            <td>${player.max_streak}</td>
                            <td>${player.total_duration}s</td>
                            <td>${player.games_played}</td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                document.getElementById('scoreboard-body').innerHTML = `<tr><td colspan="6" class="error">Exception: ${err.message}</td></tr>`;
            }
        });
    </script>
</body>
</html>
