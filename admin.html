<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotionX - Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="bg-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <header>
        <div class="logo">
            <h1>Motion<span class="logo-accent">X</span> <span style="font-size:0.6em; color: var(--error-color);">ADMIN</span></h1>
        </div>
        <nav>
            <a href="index.html">🏠 Back to Site</a>
        </nav>
    </header>

    <main>
        <!-- Login Panel -->
        <div class="panel fade-in-up" id="login-panel" style="max-width: 420px;">
            <div class="panel-header">
                <h2>🔐 Admin Login</h2>
                <p class="panel-subtitle">Authorized personnel only</p>
            </div>
            <form id="admin-login-form">
                <div class="form-group">
                    <label for="admin-pass">🔑 Admin Password</label>
                    <input type="password" id="admin-pass" required placeholder="Enter admin password...">
                </div>
                
                <div class="form-group">
                    <label id="captcha-label">🤖 Anti-bot check</label>
                    <input type="number" id="captcha-input" required placeholder="Your answer...">
                </div>

                <button type="submit" class="btn-primary">🔓 Authenticate</button>
                <div id="login-msg" style="margin-top: 1rem;"></div>
            </form>
        </div>

        <!-- Dashboard Panel -->
        <div class="panel fade-in-up" id="dashboard-panel" style="display:none; max-width: 960px; width: 95%;">
            <div class="panel-header">
                <h2>⚙️ Player Management</h2>
                <p class="panel-subtitle">Edit stats, delete accounts, manage your warriors</p>
            </div>
            <div id="dash-msg" style="margin-bottom: 1rem;"></div>
            <div class="table-wrapper">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>👤 Username</th>
                            <th>🪙 Coins</th>
                            <th>💪 Reps</th>
                            <th>⏱️ Time (s)</th>
                            <th>🔥 Streak</th>
                            <th>🎮 Games</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="user-list">
                        <tr><td colspan="7" style="text-align:center;"><div class="spinner"></div> Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer>
        <p>MotionX Admin Panel &copy; 2026</p>
    </footer>

    <script src="app.js"></script>
    <script>
        let adminPassword = "";
        let expectedCaptcha = 0;

        function generateCaptcha() {
            const a = Math.floor(Math.random() * 10) + 1;
            const b = Math.floor(Math.random() * 10) + 1;
            expectedCaptcha = a + b;
            document.getElementById('captcha-label').innerText = `🤖 What is ${a} + ${b}?`;
            document.getElementById('captcha-input').value = '';
        }

        document.addEventListener('DOMContentLoaded', generateCaptcha);

        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass = document.getElementById('admin-pass').value;
            const captcha = parseInt(document.getElementById('captcha-input').value);
            const msg = document.getElementById('login-msg');

            if (captcha !== expectedCaptcha) {
                msg.innerHTML = '<span class="error">❌ Incorrect CAPTCHA!</span>';
                generateCaptcha();
                return;
            }

            msg.innerHTML = '<span class="loading-text"><div class="spinner"></div> Verifying...</span>';

            try {
                const { data, error } = await window.supabaseClient.rpc('admin_manage', {
                    p_pass: pass,
                    p_action: 'LOGIN'
                });

                if (error) {
                    msg.innerHTML = `<span class="error">❌ ${error.message}</span>`;
                } else if (data.success) {
                    adminPassword = pass;
                    document.getElementById('login-panel').style.display = 'none';
                    document.getElementById('dashboard-panel').style.display = 'block';
                    loadUsers();
                } else {
                    msg.innerHTML = `<span class="error">❌ ${data.message}</span>`;
                    generateCaptcha();
                }
            } catch (err) {
                msg.innerHTML = `<span class="error">❌ ${err.message}</span>`;
            }
        });

        async function loadUsers() {
            const tbody = document.getElementById('user-list');
            
            try {
                const { data, error } = await window.supabaseClient
                    .from('profiles')
                    .select('*')
                    .order('coins', { ascending: false });

                if (error) throw error;

                tbody.innerHTML = '';
                
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; opacity: 0.6;">No users found.</td></tr>';
                    return;
                }

                data.forEach(user => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="player-name">${user.username}</td>
                        <td><input type="number" class="edit-input" id="coins-${user.username}" value="${user.coins}"></td>
                        <td><input type="number" class="edit-input" id="reps-${user.username}" value="${user.reps}"></td>
                        <td><input type="number" class="edit-input" id="time-${user.username}" value="${user.total_duration}"></td>
                        <td><input type="number" class="edit-input" id="streak-${user.username}" value="${user.max_streak}"></td>
                        <td>${user.games_played}</td>
                        <td>
                            <button class="action-btn" onclick="saveUser('${user.username}')">💾 Save</button>
                            <button class="action-btn delete-btn" onclick="deleteUser('${user.username}')">🗑️ Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                document.getElementById('dash-msg').innerHTML = `<span class="error">❌ ${err.message}</span>`;
            }
        }

        async function saveUser(username) {
            const coins = parseInt(document.getElementById(`coins-${username}`).value);
            const reps = parseInt(document.getElementById(`reps-${username}`).value);
            const time = parseInt(document.getElementById(`time-${username}`).value);
            const streak = parseInt(document.getElementById(`streak-${username}`).value);
            
            const msg = document.getElementById('dash-msg');
            msg.innerHTML = `<span class="loading-text"><div class="spinner"></div> Saving ${username}...</span>`;

            try {
                const { data, error } = await window.supabaseClient.rpc('admin_manage', {
                    p_pass: adminPassword,
                    p_action: 'UPDATE',
                    p_username: username,
                    p_coins: coins,
                    p_reps: reps,
                    p_duration: time,
                    p_streak: streak
                });

                if (error) throw error;
                if (data.success) {
                    msg.innerHTML = `<span class="success">✅ ${username} updated!</span>`;
                } else {
                    msg.innerHTML = `<span class="error">❌ ${data.message}</span>`;
                }
            } catch (err) {
                msg.innerHTML = `<span class="error">❌ Update failed: ${err.message}</span>`;
            }
        }

        async function deleteUser(username) {
            if (!confirm(`⚠️ Are you absolutely sure you want to delete "${username}"?\n\nThis cannot be undone!`)) return;

            const msg = document.getElementById('dash-msg');
            msg.innerHTML = `<span class="loading-text"><div class="spinner"></div> Deleting ${username}...</span>`;

            try {
                const { data, error } = await window.supabaseClient.rpc('admin_manage', {
                    p_pass: adminPassword,
                    p_action: 'DELETE',
                    p_username: username
                });

                if (error) throw error;
                if (data.success) {
                    msg.innerHTML = `<span class="success">✅ ${username} deleted!</span>`;
                    loadUsers();
                } else {
                    msg.innerHTML = `<span class="error">❌ ${data.message}</span>`;
                }
            } catch (err) {
                msg.innerHTML = `<span class="error">❌ Delete failed: ${err.message}</span>`;
            }
        }
    </script>
</body>
</html>
