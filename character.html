<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotionX - My Character</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .danger-zone { margin-top: 30px; padding: 15px; border: 2px dashed #d32f2f; background: rgba(0,0,0,0.3); border-radius: 8px; text-align: center; }
        .danger-btn { background: transparent; border: 2px solid #d32f2f; color: #d32f2f; cursor: pointer; padding: 8px 16px; font-family: inherit; transition: 0.2s; }
        .danger-btn:hover { background: #d32f2f; color: white; }
    </style>
</head>
<body>
    <header>
        <h1>MotionX</h1>
        <nav>
            <a href="index.html">Scoreboard</a>
            <a href="#" id="nav-logout">Logout</a>
        </nav>
    </header>

    <main>
        <div class="panel" id="char-panel" style="display:none;">
            <h2 id="char-name">Player Stats</h2>
            <table>
                <tr><th>Total Coins</th><td id="stat-coins">0</td></tr>
                <tr><th>Total Reps</th><td id="stat-reps">0</td></tr>
                <tr><th>Max Streak</th><td id="stat-streak">0</td></tr>
                <tr><th>Time Survived</th><td id="stat-time">0s</td></tr>
                <tr><th>Games Played</th><td id="stat-games">0</td></tr>
            </table>

            <div class="danger-zone">
                <h3 style="color: #d32f2f; margin-top: 0;">Danger Zone</h3>
                <button class="danger-btn" id="btn-delete-account">Delete My Account</button>
                <div id="delete-msg" style="margin-top: 10px; font-size: 0.9rem;"></div>
            </div>
        </div>
        <div id="loading-msg" style="font-size:1.5rem; text-align:center;">Loading profile...</div>
    </main>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const username = localStorage.getItem('motionx_user');
            
            if (!username) {
                window.location.href = 'auth.html';
                return;
            }

            try {
                const { data, error } = await window.supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('username', username)
                    .single();

                document.getElementById('loading-msg').style.display = 'none';

                if (error) {
                    document.getElementById('char-panel').innerHTML = `<h2 class="error">Error loading profile</h2>`;
                    document.getElementById('char-panel').style.display = 'block';
                    return;
                }

                document.getElementById('char-name').innerText = `${data.username}'s Profile`;
                document.getElementById('stat-coins').innerText = data.coins;
                document.getElementById('stat-reps').innerText = data.reps;
                document.getElementById('stat-time').innerText = data.total_duration + 's';
                document.getElementById('stat-streak').innerText = data.max_streak;
                document.getElementById('stat-games').innerText = data.games_played;
                
                document.getElementById('char-panel').style.display = 'block';
            } catch (err) {
                console.error("Exception:", err);
            }
        });

        document.getElementById('nav-logout').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('motionx_user');
            window.location.href = 'index.html';
        });

        document.getElementById('btn-delete-account').addEventListener('click', async () => {
            const username = localStorage.getItem('motionx_user');
            if (!username) return;

            const pass = prompt(`WARNING: This is permanent!\nTo delete your account, please type your password for '${username}':`);
            if (!pass) return;

            const msg = document.getElementById('delete-msg');
            msg.innerHTML = '<span style="color:var(--accent-color)">Deleting...</span>';

            try {
                const { data, error } = await window.supabaseClient.rpc('delete_self', {
                    p_username: username,
                    p_password: pass
                });

                if (error) {
                    msg.innerHTML = `<span class="error">Error: ${error.message}</span>`;
                } else if (data === true) {
                    alert("Your account has been deleted.");
                    localStorage.removeItem('motionx_user');
                    window.location.href = 'index.html';
                } else {
                    msg.innerHTML = '<span class="error">Incorrect password!</span>';
                }
            } catch (err) {
                msg.innerHTML = `<span class="error">Exception: ${err.message}</span>`;
            }
        });
    </script>
</body>
</html>
